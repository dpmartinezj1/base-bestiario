<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <title>¿Qué comida colombiana eres?</title>
  
  <!-- Tipografía festivalera y legible -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
  
  <!-- Hoja de estilos -->
  <link rel="stylesheet" href="estilo.css" />
  
  <!-- Librería de Confeti por CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script src="script.js" defer></script>

  <!-- Audio de La Pollera Colorá -->

    <div class="cinta-festival"></div>

    <h1 id="tituloPagina">¿Qué comida colombiana eres?</h1>
    
    <div id="contenedorPersonaje">
      <img class="imagen" id="cabeza" src="" alt="Parte 1" />
      <img class="imagen" id="tronco" src="" alt="Parte 2" />
      <img class="imagen" id="patas" src="" alt="Parte 3" />
    </div>

    <button id="boton">¡DESCÚBRELO!</button>
  </div>

</html>

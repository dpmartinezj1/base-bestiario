<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <title>:: Bestiario / Collage Colombiano ::</title>
  
  <!-- Tipografía colombiana/artesanal de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
  
  <!-- Hoja de estilos -->
  <link rel="stylesheet" href="estilo.css" />
  
  <!-- Librería de Confeti por CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Script principal -->
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Audio de La Pollera Colorá -->
  <audio id="musicaPollera" src="La Pollera Colora (Letra Lyrics).mp3" preload="auto"></audio>

  <div id="contenedorGeneral">
    <div class="bandera-decorativa"></div>
    <h1 id="tituloPagina">
      <a href="https://es.wikipedia.org/wiki/Bestiario" target="_blank">BESTIARIO COLOMBIANO</a>
    </h1>
    
    <div id="contenedorPersonaje">
      <img class="imagen" id="cabeza" src="" alt="Cabeza" />
      <img class="imagen" id="tronco" src="" alt="Tronco" />
      <img class="imagen" id="patas" src="" alt="Patas" />
    </div>

    <button id="boton">MEZCLAR</button>
  </div>

</body>
</html>
